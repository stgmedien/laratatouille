<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:24px;background:var(--surface-page)}#root{display:flex;flex-direction:column;gap:14px}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Notice, Dialog, Button } = window.LaRatatouilleDesignSystem_9f9119;
function Demo(){
  const [open,setOpen]=React.useState(false);
  return (<>
    <Notice tone="success" title="Tisch notiert">Wir schicken Ihnen die Bestätigung per E-Mail.</Notice>
    <Notice tone="notice">Vom 6. bis 20. Januar haben wir Betriebsferien.</Notice>
    <Notice tone="info" onDismiss={()=>{}}>Für Gruppen ab sechs Personen rufen Sie uns bitte an.</Notice>
    <Notice tone="danger">Die Terrasse ist heute wegen Wind geschlossen.</Notice>
    <div><Button variant="secondary" size="sm" onClick={()=>setOpen(true)}>Dialog zeigen</Button></div>
    <Dialog open={open} onClose={()=>setOpen(false)} eyebrow="Reservierung" title="Tisch für zwei, Freitag 20:00"
      footer={<><Button variant="ghost" onClick={()=>setOpen(false)}>Ändern</Button><Button onClick={()=>setOpen(false)}>Bestätigen</Button></>}>
      Wir halten den Tisch 20 Minuten für Sie frei.
    </Dialog>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
