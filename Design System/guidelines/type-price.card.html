<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font:var(--type-body)}.sw{display:flex;gap:10px}.chip{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid color-mix(in oklab,var(--ink-900) 8%,transparent)}.chip b{font:var(--type-eyebrow);letter-spacing:var(--ls-caps);text-transform:uppercase;font-weight:var(--fw-semibold)}.chip span{font-family:var(--font-mono);font-size:10px;opacity:.8}.row{display:flex;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px solid var(--border-hairline)}.lead{flex:1;border-bottom:1px dotted var(--border-strong);opacity:.5;transform:translateY(-4px)}</style></head><body>
<div class="row"><span style="font:var(--type-subhead);color:var(--text-heading)">Sardinen, gegrillt</span><span class="lead"></span><span style="font:var(--type-price);font-variant-numeric:lining-nums tabular-nums;color:var(--text-heading)">14 €</span></div>
<div class="row" style="border:0"><span style="font:var(--type-subhead);color:var(--text-heading)">Menü, 6 Gänge</span><span class="lead"></span><span style="font:var(--type-price);font-variant-numeric:lining-nums tabular-nums;color:var(--text-heading)">68 €</span></div>
</body></html>
