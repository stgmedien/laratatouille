<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font:var(--type-body)}.sw{display:flex;gap:10px}.chip{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid color-mix(in oklab,var(--ink-900) 8%,transparent)}.chip b{font:var(--type-eyebrow);letter-spacing:var(--ls-caps);text-transform:uppercase;font-weight:var(--fw-semibold)}.chip span{font-family:var(--font-mono);font-size:10px;opacity:.8}.use{display:flex;align-items:center;gap:24px;margin-top:14px;font:var(--type-caption);color:var(--text-faint)}</style></head><body><div class="sw">
<div class="chip" style="background:#BCA05F;color:#FFFFFF"><b>500</b><span>#BCA05F</span></div><div class="chip" style="background:#EBDFC0;color:#6B5A2E"><b>200</b><span>#EBDFC0</span></div>
</div>
<div class="use"><span style="width:56px;height:2px;background:var(--gilt-500)"></span>Heading-Rule<span style="width:5px;height:5px;transform:rotate(45deg);background:var(--gilt-500)"></span>Ornament<span style="display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--gilt-200);color:var(--pine-800);font:var(--type-eyebrow);letter-spacing:var(--ls-caps);text-transform:uppercase">Signature</span>Tag-Fill</div>
</body></html>
