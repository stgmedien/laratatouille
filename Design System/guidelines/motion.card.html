<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font:var(--type-body)}.sw{display:flex;gap:10px}.chip{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid color-mix(in oklab,var(--ink-900) 8%,transparent)}.chip b{font:var(--type-eyebrow);letter-spacing:var(--ls-caps);text-transform:uppercase;font-weight:var(--fw-semibold)}.chip span{font-family:var(--font-mono);font-size:10px;opacity:.8}.r{display:flex;flex-direction:column;gap:10px}.l{display:flex;align-items:center;gap:12px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.t{width:118px;flex:0 0 118px}.bar{height:6px;background:var(--clay-300);border-radius:999px}</style></head><body>
<div class="r">
<div class="l"><span class="t">90ms instant</span><span class="bar" style="width:9%"></span></div>
<div class="l"><span class="t">160ms fast</span><span class="bar" style="width:16%"></span></div>
<div class="l"><span class="t">240ms base</span><span class="bar" style="width:24%"></span></div>
<div class="l"><span class="t">420ms slow</span><span class="bar" style="width:42%"></span></div>
<div class="l" style="color:var(--text-faint)"><span class="t">easing</span>cubic-bezier(.4,0,.2,1) · cubic-bezier(.16,1,.3,1)</div>
</div></body></html>
