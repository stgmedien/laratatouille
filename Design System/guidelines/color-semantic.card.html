<!-- @dsCard group="Colors" viewport="700x170" name="Semantic aliases" subtitle="Always reach for these, not the raw ramps." -->
<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font:var(--type-body)}.sw{display:flex;gap:10px}.chip{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid color-mix(in oklab,var(--ink-900) 8%,transparent)}.chip b{font:var(--type-eyebrow);letter-spacing:var(--ls-caps);text-transform:uppercase;font-weight:var(--fw-semibold)}.chip span{font-family:var(--font-mono);font-size:10px;opacity:.8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 18px}.pair{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.dot{width:18px;height:18px;border-radius:2px;border:1px solid color-mix(in oklab,var(--ink-900) 10%,transparent);flex:0 0 auto}</style></head><body>
<div class="grid">
<div class="pair"><span class="dot" style="background:var(--surface-page)"></span>--surface-page</div>
<div class="pair"><span class="dot" style="background:var(--surface-card)"></span>--surface-card</div>
<div class="pair"><span class="dot" style="background:var(--surface-sunken)"></span>--surface-sunken</div>
<div class="pair"><span class="dot" style="background:var(--surface-inverse)"></span>--surface-inverse</div>
<div class="pair"><span class="dot" style="background:var(--surface-accent)"></span>--surface-accent</div>
<div class="pair"><span class="dot" style="background:var(--surface-accent-soft)"></span>--surface-accent-soft</div>
<div class="pair"><span class="dot" style="background:var(--text-heading)"></span>--text-heading</div>
<div class="pair"><span class="dot" style="background:var(--text-body)"></span>--text-body</div>
<div class="pair"><span class="dot" style="background:var(--text-muted)"></span>--text-muted</div>
<div class="pair"><span class="dot" style="background:var(--text-accent)"></span>--text-accent</div>
<div class="pair"><span class="dot" style="background:var(--border-hairline)"></span>--border-hairline</div>
<div class="pair"><span class="dot" style="background:var(--rule-gilt)"></span>--rule-gilt</div>
<div class="pair"><span class="dot" style="background:var(--state-success)"></span>--state-success</div>
<div class="pair"><span class="dot" style="background:var(--state-notice)"></span>--state-notice</div>
<div class="pair"><span class="dot" style="background:var(--state-danger)"></span>--state-danger</div>
</div></body></html>
