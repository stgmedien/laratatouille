<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font:var(--type-body)}.sw{display:flex;gap:10px}.chip{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid color-mix(in oklab,var(--ink-900) 8%,transparent)}.chip b{font:var(--type-eyebrow);letter-spacing:var(--ls-caps);text-transform:uppercase;font-weight:var(--fw-semibold)}.chip span{font-family:var(--font-mono);font-size:10px;opacity:.8}.sec{background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-md);padding:32px}.note{font-family:var(--font-mono);font-size:10px;color:var(--clay-600)}</style></head><body>
<div class="sec">
<span class="note">↕ 56–128px section-y</span>
<div style="display:flex;flex-direction:column;gap:16px;margin-top:12px">
<span style="font:var(--type-eyebrow);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--text-accent)">Das Haus</span>
<h2 style="margin:0;font:var(--type-section);color:var(--text-heading)">Klein, laut, ehrlich</h2>
<span style="width:56px;height:2px;background:var(--gilt-500)"></span>
<p style="margin:0;font:var(--type-body);color:var(--text-muted);max-width:52ch">Vierundzwanzig Plätze, eine offene Küche und eine Terrasse, die zur Gasse hin offen steht.</p>
</div></div></body></html>
