<!-- @dsCard group="Brand" viewport="700x190" name="Logo — monogram roundel" subtitle="LR in Marcellus, double gilt ring. SVG original in assets/logo.svg" -->
<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page)}.r{display:flex}.half{flex:1;padding:24px;display:flex;align-items:center;justify-content:center;gap:32px}
.lr{width:110px;height:110px;border-radius:50%;border:2px solid var(--gilt-500);position:relative;display:flex;align-items:center;justify-content:center}
.lr i{position:absolute;inset:5px;border-radius:50%;border:1px solid var(--gilt-500);opacity:.6}
.lr b{font-family:var(--font-display);font-weight:400;font-size:38px;letter-spacing:.06em;transform:translate(1px,-3px)}
.lr s{position:absolute;bottom:17px;left:50%;width:5px;height:5px;transform:translateX(-50%) rotate(45deg);background:var(--gilt-500)}
.cap{font:var(--type-caption);color:var(--text-faint);max-width:20ch}</style></head><body>
<div class="r">
<div class="half" style="background:var(--linen-050)"><span class="lr"><i></i><b style="color:var(--pine-800)">LR</b><s></s></span><span class="cap">Hell: Pine-Monogramm auf Leinen</span></div>
<div class="half" style="background:var(--pine-900)"><span class="lr"><i></i><b style="color:var(--linen-100)">LR</b><s></s></span><span class="cap" style="color:var(--pine-200)">Invers: Leinen auf Pine — Footer, Stempel, Favicon</span></div>
</div></body></html>
