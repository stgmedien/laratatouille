<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>La Ratatouille — Website UI Kit</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--surface-page)}#root{min-height:100vh}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../assets/image-slot.js"></script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="MenuScreen.jsx"></script>
<script type="text/babel" src="HouseScreen.jsx"></script>
<script type="text/babel" src="ReserveScreen.jsx"></script>
<script type="text/babel">
const { NavBar } = window.LaRatatouilleDesignSystem_9f9119;
const LINKS=[{href:'/karte',label:'Karte'},{href:'/haus',label:'Das Haus'},{href:'/reservieren',label:'Reservieren'}];
function App(){
  const [route,setRoute]=React.useState('/');
  const go=(href)=>{ setRoute(href==='#top'?'/':href); window.scrollTo(0,0); };
  const dark = route==='/' || route==='/haus';
  return (
    <div>
      <NavBar links={LINKS} activeHref={route} tone={dark?'dark':'light'} onNavigate={go}
        cta={{label:'Reservieren', onClick:()=>go('/reservieren')}}
        style={dark?{position:'fixed',left:0,right:0,background:'transparent',backdropFilter:'none',borderBottomColor:'var(--border-inverse)'}:null} />
      {route==='/' && <HomeScreen onNavigate={go} />}
      {route==='/karte' && <MenuScreen />}
      {route==='/haus' && <HouseScreen onNavigate={go} />}
      {route==='/reservieren' && <ReserveScreen />}
      <Footer onNavigate={go} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
