<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{width:1280px;height:854px;display:flex;overflow:hidden}
.main{flex:1;background:var(--pine-800);display:flex;align-items:center;justify-content:center}
.roundel{width:400px;height:400px;border-radius:50%;border:5px solid var(--gilt-500);position:relative;display:flex;align-items:center;justify-content:center}
.roundel i{position:absolute;inset:15px;border-radius:50%;border:2px solid var(--gilt-500);opacity:.6}
.roundel b{font-family:var(--font-display);font-weight:400;font-size:140px;letter-spacing:.06em;color:var(--linen-100);transform:translate(4px,-10px)}
.roundel s{position:absolute;bottom:62px;left:50%;width:18px;height:18px;transform:translateX(-50%) rotate(45deg);background:var(--gilt-500)}
.strip{width:24%;display:flex;flex-direction:column}.strip span{flex:1}
</style></head><body>
<div class="main"><div class="roundel"><i></i><b>LR</b><s></s></div></div>
<div class="strip"><span style="background:#EBDFC0"></span><span style="background:#AFC095"></span><span style="background:#64794D"></span><span style="background:#2A4534"></span></div>
</body></html>
